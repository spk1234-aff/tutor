<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b3a8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="สอนพิเศษ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>บันทึกสอนพิเศษ</title>
<style>
@font-face{font-family:"TH Sarabun New";src:url(fonts/thsarabunnew-webfont.ttf) format("truetype");font-weight:400}
@font-face{font-family:"TH Sarabun New";src:url(fonts/thsarabunnew_bold-webfont.ttf) format("truetype");font-weight:700}
:root{
  --ink:#1b3a8c; --ink2:#0f2463; --text:#1c2333; --mute:#66708a; --line:#dde4f1;
  --paper:#fbfcff; --grid:#e6ecf7; --margin:#ef9aa0;
  --hl-yellow:#fff176; --hl-orange:#ffc98a; --stamp:#d0313d; --paid:#17885d;
  --red:var(--stamp); --orange:#e2700c; --green:var(--paid); --blue:var(--ink);
}
*{box-sizing:border-box}
html,body{overflow-x:hidden;margin:0;color:var(--text);font-family:"TH Sarabun New",sans-serif;font-size:21px;line-height:1.3;-webkit-text-size-adjust:100%}
body{background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;background-attachment:fixed;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #7ea2ff;outline-offset:2px}

header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 18px 10px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 0 var(--ink2)}
header img{width:40px;height:40px;border-radius:10px;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.brand{flex:1;line-height:1.05}
header h1{font-size:30px;margin:0;font-weight:700;letter-spacing:.2px}
#today{font-size:17px;opacity:.75}
#sync{font-size:16px;white-space:nowrap;background:rgba(255,255,255,.12);border-radius:999px;padding:1px 12px}
.iconbtn{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:12px;width:42px;height:40px;cursor:pointer;font-size:22px;display:grid;place-items:center}

main{max-width:1000px;margin:0 auto;padding:18px 16px 110px}

/* สรุปด้านบน: เขียนเหมือนโน้ตในสมุด */
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.sum{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:6px 14px 4px;min-width:150px;flex:1}
.sum .v{font-size:34px;font-weight:700;line-height:1}
.sum .k{font-size:18px;color:var(--mute)}
.sum.due .v{color:var(--orange)} .sum.owe .v{color:var(--stamp)} .sum.month .v{color:var(--ink)}
.sum.zero .v{color:#b7bfd0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
/* การ์ด = กระดาษสมุดมีเส้นกั้นหน้า */
.card{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:6px 18px 18px 6px;padding:12px 14px 12px 64px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 0 var(--line),0 6px 14px -10px rgba(27,58,140,.35)}
.card::before{content:"";position:absolute;left:50px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.7}
.avatar{position:absolute;left:5px;top:10px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:24px;color:#fff;overflow:hidden}
.avatar.emoji{background:#eef2fb !important;font-size:26px;box-shadow:inset 0 0 0 2px var(--line)}
.avatar img{width:100%;height:100%;object-fit:cover}
.iconpick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.iconpick .ic{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;font-size:26px;cursor:pointer;overflow:hidden;padding:0}
.iconpick .ic.on{border-color:var(--ink);box-shadow:0 0 0 3px #c9d6f5}
.iconpick .ic img{width:100%;height:100%;object-fit:cover}
.iconpick .ic.letter{color:#fff;font-weight:700;font-size:24px}
.card .top{display:flex;align-items:center;gap:8px;cursor:pointer}
.card .name{font-size:29px;font-weight:700;flex:1;line-height:1.1;color:var(--text)}
.card .meta{color:var(--mute);font-size:18px;margin-top:-4px}
.card.paused{opacity:.6}
.editbtn{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:0 10px;font-size:18px;cursor:pointer;color:var(--ink);white-space:nowrap}

/* ช่องคาบ: หนึ่งวงต่อหนึ่งคาบ */
.slots{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.slot{width:24px;height:24px;border-radius:50%;border:2px dashed #b9c4dc;display:grid;place-items:center}
.slot.on{border:2px solid var(--ink);background:var(--ink)}
.slot.on::after{content:"";width:9px;height:5px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.card.orange .slot.on{background:var(--orange);border-color:var(--orange)}
.slots .cnt{margin-left:6px;font-size:20px;color:var(--mute)}
.slots .cnt b{font-size:26px;color:var(--text)}

/* ข้อความสถานะ: ขีดด้วยปากกาเน้นข้อความ */
.mark{-webkit-box-decoration-break:clone;box-decoration-break:clone;align-self:flex-start;font-weight:700;font-size:21px;padding:0 6px;border-radius:3px;line-height:1.25}
.mark.y{background:linear-gradient(transparent 35%,var(--hl-yellow) 35%,var(--hl-yellow) 92%,transparent 92%)}
.mark.o{background:linear-gradient(transparent 35%,var(--hl-orange) 35%,var(--hl-orange) 92%,transparent 92%)}
.mark.r{color:var(--stamp)}
.owe{border:1.5px dashed #f0b3b8;background:#fff7f7;border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;gap:6px}
.owe .amt{font-size:26px;font-weight:700;color:var(--stamp)}

/* ตราประทับเมื่อครบรอบ */
.stamp{flex:none;transform:rotate(-10deg);border:3px solid var(--orange);color:var(--orange);border-radius:10px;padding:0 10px;font-weight:700;font-size:22px;letter-spacing:.5px;opacity:.9;pointer-events:none;background:rgba(255,255,255,.7)}
.stamp.r{border-color:var(--stamp);color:var(--stamp)}


.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{white-space:nowrap;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:5px 14px;cursor:pointer;font-size:20px;color:var(--text)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:700}
.btn.red{background:var(--stamp);border-color:var(--stamp);color:#fff;font-weight:700}
.btn.green{background:var(--paid);border-color:var(--paid);color:#fff;font-weight:700}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--stamp)}
.btn:disabled{opacity:.45}
.grow{flex:1}
h2{font-size:24px;margin:26px 0 8px;color:var(--mute)}
.empty{background:#fff;border:2px dashed #c4cee3;border-radius:18px;padding:34px 20px;text-align:center;color:var(--mute);font-size:22px}
.empty b{color:var(--ink)}

dialog{border:0;border-radius:22px;padding:0;width:min(580px,94vw);max-height:90vh;box-shadow:0 24px 70px rgba(15,36,99,.35);color:var(--text)}
dialog::backdrop{background:rgba(15,36,99,.45)}
dialog[open]{animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(12px);opacity:.4}to{transform:none;opacity:1}}
@media (max-width:600px){
  dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:22px 22px 0 0;max-height:92vh}
  dialog[open]{animation:up .2s ease-out}
  .sheet{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
}
@keyframes up{from{transform:translateY(40%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){dialog[open]{animation:none}}
.sheet{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;overflow:auto;max-height:90vh}
.sheet h3{margin:0;font-size:30px;color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:2px;font-size:19px;color:var(--mute)}
label.f input,label.f select,label.f textarea{color:var(--text);font-size:23px;border:1.5px solid var(--line);border-radius:12px;padding:5px 12px;background:#fff}
label.f input:focus,label.f textarea:focus{border-color:var(--ink);outline:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:4px 18px;cursor:pointer;background:#fff;font-size:22px}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff;font-weight:700}
table.s{width:100%;border-collapse:collapse;font-size:21px}
table.s td,table.s th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
table.s th{color:var(--mute);font-weight:400}
.inv{border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;gap:4px}
.inv.paid{background:#f1faf5;border-color:#cdebdc}
.hmonth{display:flex;align-items:baseline;gap:8px;margin:10px 0 2px;border-bottom:2px solid var(--line);padding-bottom:2px}
.hmonth b{font-size:24px;color:var(--ink);flex:1}
.hrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.hrow .avatar{position:static;flex:none;width:38px;height:38px;font-size:21px}
.hrow .who{flex:1;min-width:0;line-height:1.15}
.hrow .who b{font-size:22px}
.hrow .amt{font-weight:700;font-size:23px;white-space:nowrap}
.hchips .chip{padding:2px 14px;font-size:20px}
.hrow.issued .amt{color:var(--stamp)} .hrow.paid .amt{color:var(--paid)}
.tag{font-size:17px;border-radius:999px;padding:0 10px;display:inline-block}
.tag.paid{background:#d6f0e3;color:var(--paid)} .tag.issued{background:#fde8ea;color:var(--stamp)}
#preview{max-width:100%;border:1.5px solid var(--line);border-radius:12px}
.hint{font-size:18px;color:var(--mute)}
.others{display:flex;flex-direction:column;gap:2px;max-height:180px;overflow:auto;border:1.5px solid var(--line);border-radius:12px;padding:6px 10px}
.toast{white-space:nowrap;position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink2);color:#fff;border-radius:999px;padding:6px 22px;z-index:99;font-size:21px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));border-radius:999px;padding:10px 24px;font-size:22px;box-shadow:0 8px 22px -6px rgba(15,36,99,.6)}
@media (max-width:520px){
  header{padding-left:14px;padding-right:14px;gap:10px} header h1{font-size:26px} header img{width:36px;height:36px}
  #sync{font-size:0;padding:0 4px;background:none} #sync::first-letter{font-size:20px}
  .iconbtn{width:38px}
  .summary{gap:8px}.sum{min-width:0;padding:4px 10px 2px}.sum .v{font-size:28px}.sum .k{font-size:16px}
  main{padding-left:12px;padding-right:12px}
}
</style>
</head>
<body>
<header>
  <img src="icon-192.png" alt="">
  <div class="brand"><h1>สอนพิเศษ</h1><div id="today"></div></div>
  <span id="sync"></span>
  <button class="iconbtn" id="btnHistory" title="ประวัติการเงิน" aria-label="ประวัติการเงิน">📒</button>
  <button class="iconbtn" id="btnSettings" title="ตั้งค่า">⚙️</button>
</header>
<main>
  <div class="summary" id="summary"></div>
  <div id="list"></div>
</main>
<button class="btn primary fab" id="btnAdd">+ นักเรียน</button>
<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>
<div class="toast" id="toast"></div>

<script type="module">
/* ====================== ค่าคงที่ ====================== */
// วางค่า firebaseConfig ตรงนี้เมื่อสร้างโปรเจกต์แล้ว (หรือวางในหน้า ตั้งค่า ก็ได้)
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB5jzaZiPGq0oYPqB9MCljXAKzs05rhPBg",
  authDomain: "sirearth-tutor.firebaseapp.com",
  projectId: "sirearth-tutor",
  storageBucket: "sirearth-tutor.firebasestorage.app",
  messagingSenderId: "472071806564",
  appId: "1:472071806564:web:88e1ac2575318a320dc971",
};
const FIREBASE_VER = '10.12.2';
const PROMPTPAY_NOTE = ['สแกนด้วยแอปธนาคาร', 'แล้วกรอกยอดเงินเอง'];

const DEFAULT_SETTINGS = {
  title: 'ใบแจ้งชำระค่าเรียนพิเศษ',
  teacher: 'ครูศาสตราวุฒิ อาชนะชัย',
  weeks: 4,
  prices: {1: 1000, 2: 2000, 3: 3000},
  bank: 'ธนาคารกสิกรไทย',
  account: '051-2-69401-2',
  accountName: 'นายศาสตราวุฒิ อาชนะชัย',
  footer: 'ชำระแล้วรบกวนส่งสลิปทาง LINE ด้วยนะครับ ขอบคุณครับ',
  hours: [1.5, 2],
  nextNo: 1,
};

/* ====================== ตัวช่วย ====================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const TH_DAYS = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const TH_MONTH_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_DAY_FULL = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const TH_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const pad = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const thDate = (s, withDay = true) => { const d = parseISO(s); return `${withDay ? TH_DAYS[d.getDay()] + ' ' : ''}${d.getDate()} ${TH_MONTHS[d.getMonth()]} ${d.getFullYear() + 543}`; };
const fmtH = h => `${+(+h).toFixed(2)} ชม.`;
const money = n => (+n).toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const money0 = n => (+n).toLocaleString('th-TH', {maximumFractionDigits: 2});
const daysSince = iso => Math.floor((parseISO(todayISO()) - parseISO(iso)) / 864e5);
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2200); }

/* ====================== ข้อมูล ====================== */
const db = { students: {}, sessions: {}, invoices: {}, settings: {...DEFAULT_SETTINGS} };
const LOCAL_KEY = 'tutor-local-v1';
const MIRROR_KEY = 'tutor-cloud-mirror-v1';
let cloud = null;   // { fs, fsdb, uid, auth, authApi }
let syncState = 'local';

function loadFrom(key) {
  try {
    const d = JSON.parse(localStorage.getItem(key) || 'null');
    if (d) { db.students = d.students || {}; db.sessions = d.sessions || {}; db.invoices = d.invoices || {}; db.settings = {...DEFAULT_SETTINGS, ...(d.settings || {})}; }
  } catch (e) { console.warn(e); }
}
function saveSnapshot() {
  try { localStorage.setItem(cloud ? MIRROR_KEY : LOCAL_KEY, JSON.stringify(db)); } catch (e) { console.warn(e); }
}
function put(col, obj) {
  db[col][obj.id] = obj; saveSnapshot(); render();
  if (cloud) cloud.fs.setDoc(cloud.fs.doc(cloud.fsdb, 'users', cloud.uid, col, obj.id), obj).catch(e => toast('ซิงก์ไม่สำเร็จ: ' + e.code));
}
function del(col, id) {
  delete db[col][id]; saveSnapshot(); render();
  if (cloud) cloud.fs.deleteDoc(cloud.fs.doc(cloud.fsdb, 'users', cloud.uid, col, id)).catch(e => toast('ซิงก์ไม่สำเร็จ: ' + e.code));
}
function putSettings(patch) {
  db.settings = {...db.settings, ...patch}; saveSnapshot(); render();
  if (cloud) cloud.fs.setDoc(cloud.fs.doc(cloud.fsdb, 'users', cloud.uid, 'meta', 'settings'), db.settings).catch(e => toast('ซิงก์ไม่สำเร็จ: ' + e.code));
}

/* ====================== ตรรกะรอบ ====================== */
const cycleSize = st => +st.cycleSize || (+st.perWeek * (+db.settings.weeks || 4));
const studentSessions = sid => Object.values(db.sessions).filter(x => x.studentId === sid).sort((a, b) => a.date.localeCompare(b.date) || (a.createdAt || 0) - (b.createdAt || 0));
const studentInvoices = sid => Object.values(db.invoices).filter(x => x.studentId === sid).sort((a, b) => (a.round || 0) - (b.round || 0));
function billedIds(sid) { const s = new Set(); studentInvoices(sid).forEach(iv => (iv.sessionIds || []).forEach(id => s.add(id))); return s; }
function unbilled(sid) { const b = billedIds(sid); return studentSessions(sid).filter(x => !b.has(x.id)); }
function status(st) {
  const n = cycleSize(st), ub = unbilled(st.id), unpaid = studentInvoices(st.id).filter(i => i.status !== 'paid');
  let level = 0; // 0 ปกติ 1 เหลือ 1 คาบ 2 ครบรอบ 3 ค้างชำระ
  if (ub.length >= n - 1 && n > 1) level = 1;
  if (ub.length >= n) level = 2;
  if (unpaid.length) level = Math.max(level, 3);
  return { n, ub, unpaid, level, round: studentInvoices(st.id).length + 1 };
}

/* ====================== หน้าหลัก ====================== */
function render() {
  const sts = Object.values(db.students);
  const active = sts.filter(s => !s.paused), paused = sts.filter(s => s.paused);
  const withS = active.map(s => ({ s, st: status(s) }))
    .sort((a, b) => b.st.level - a.st.level || (b.st.ub.length / b.st.n) - (a.st.ub.length / a.st.n) || a.s.name.localeCompare(b.s.name, 'th'));
  const owe = withS.filter(x => x.st.level === 3), due = withS.filter(x => x.st.ub.length >= x.st.n);
  const oweSum = owe.reduce((t, x) => t + x.st.unpaid.reduce((a, i) => a + (+i.amount), 0), 0);
  const ym = todayISO().slice(0, 7), monthSes = Object.values(db.sessions).filter(x => x.date.startsWith(ym) && db.students[x.studentId]);
  // คาบกลุ่มนับครั้งเดียว: คาบที่บันทึกพร้อมกันมี batch เดียวกัน
  const uniq = new Map(); monthSes.forEach(x => uniq.set(x.batch ? `${x.batch}|${x.k || 0}` : x.id, +x.hours));
  const monthCount = uniq.size, monthH = [...uniq.values()].reduce((t, v) => t + v, 0);
  $('#summary').innerHTML = `
    <div class="sum due ${due.length ? '' : 'zero'}"><div class="v">${due.length}</div><div class="k">คนถึงรอบเก็บเงิน</div></div>
    <div class="sum owe ${owe.length ? '' : 'zero'}"><div class="v">${money0(oweSum)}</div><div class="k">บาท รอโอน</div></div>
    <div class="sum month ${monthSes.length ? '' : 'zero'}"><div class="v">${monthCount}</div><div class="k">คาบเดือนนี้ · ${fmtH(monthH)}</div></div>`;
  if (!sts.length) {
    $('#list').innerHTML = `<div class="empty">สมุดยังว่างอยู่<br>กด <b>+ นักเรียน</b> มุมขวาล่าง เพื่อเพิ่มคนแรก</div>`;
  } else {
    $('#list').innerHTML = `<div class="grid">${withS.map(x => cardHTML(x.s, x.st)).join('')}</div>` +
      (paused.length ? `<h2>พักเรียน</h2><div class="grid">${paused.map(s => cardHTML(s, status(s))).join('')}</div>` : '');
  }

const AVATAR = ['#1b3a8c', '#0f7c78', '#8a3fb8', '#c2410c', '#2563a8', '#b0234f', '#4d7c0f', '#6d4bd1'];
const EMOJIS = ['🐶','🐱','🐰','🐻','🐼','🦊','🐯','🦁','🐸','🐧','🐥','🦄','🐙','🐳','🦖','🐢','🌸','🌻','⭐','🌈','⚽','🏀','🎮','🎨','🎸','🚀','📐','🧮'];
const avatarHTML = s => {
  const ic = s.icon || {};
  if (ic.type === 'img') return `<div class="avatar"><img src="${esc(ic.v)}" alt=""></div>`;
  if (ic.type === 'emoji') return `<div class="avatar emoji">${esc(ic.v)}</div>`;
  return `<div class="avatar" style="background:${avatarColor(s.name || '?')}">${esc(initial(s.name || '?'))}</div>`;
};
function resizeImage(file, size = 160) {
  return new Promise((res, rej) => {
    const img = new Image(); img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
      const m = Math.min(img.width, img.height); g.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, size, size);
      URL.revokeObjectURL(img.src); res(c.toDataURL('image/jpeg', 0.82));
    }; img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}
const avatarColor = name => AVATAR[[...name].reduce((h, c) => (h * 31 + c.codePointAt(0)) >>> 0, 7) % AVATAR.length];
const initial = name => { const t = name.replace(/^(น้อง|ด\.ช\.|ด\.ญ\.|นาย|นางสาว)\s*/, ''); return [...(t || name)].find(c => /[ก-ฮ A-Za-z0-9]/.test(c)) || '?'; };
function cardHTML(s, st) {
  const cls = s.paused ? 'paused' : ['', 'yellow', 'orange', 'red'][st.level];
  const shown = Math.min(st.ub.length, st.n), extra = st.ub.length - st.n;
  const last = studentSessions(s.id).slice(-1)[0];
  const full = st.ub.length >= st.n;
  const slots = st.n <= 16
    ? Array.from({ length: st.n }, (_, i) => `<span class="slot ${i < shown ? 'on' : ''}"></span>`).join('') + (extra > 0 ? `<span class="cnt">+${extra}</span>` : '')
    : `<span class="cnt"><b>${shown}</b> / ${st.n} คาบ</span>`;
  let body = '';
  st.unpaid.forEach(iv => {
    const d = daysSince(iv.issuedAt);
    body += `<div class="owe"><div class="row"><span class="amt">${money0(iv.amount)} บาท</span><span class="grow"></span><span class="mark r">${d === 0 ? 'ส่งใบแจ้งวันนี้' : `ค้างมา ${d} วัน`}</span></div>
      <div class="hint" style="margin-top:-6px">ใบแจ้งรอบที่ ${iv.round}</div>
      <div class="row"><button class="btn green grow" data-act="paid" data-id="${iv.id}">ได้รับเงินแล้ว</button><button class="btn" data-act="viewInv" data-id="${iv.id}">ดูใบแจ้ง</button></div></div>`;
  });
  if (!s.paused && full) body += `<span class="mark o">ครบรอบแล้ว ถึงเวลาเก็บเงิน</span>${extra > 0 ? `<span class="hint" style="margin-top:-6px">อีก ${extra} คาบนับเป็นรอบหน้า</span>` : ''}`;
  else if (!s.paused && st.level >= 1 && st.ub.length === st.n - 1) body += `<span class="mark y">อีก 1 คาบครบรอบ</span>`;

  return `<div class="card ${cls} ${stamp ? 'has-stamp' : ''}">
    ${avatarHTML(s)}
    <div class="top" data-act="detail" data-id="${s.id}"><div class="name">${esc(s.name)}</div>${stamp}<button class="editbtn" data-act="edit" data-id="${s.id}" title="แก้ไขข้อมูล ${esc(s.name)}" aria-label="แก้ไขข้อมูล ${esc(s.name)}">✏️ แก้ไข</button></div>
    <div class="meta">${s.perWeek} คาบ/สัปดาห์ ราคา ${money0(s.price)} บาท<br>รอบที่ ${st.round}${last ? ` สอนล่าสุด ${thDate(last.date, false)}` : ''}</div>
    <div class="slots" title="สอนแล้ว ${shown} จาก ${st.n} คาบ">${slots}</div>
    ${body}
    <div class="row">
      <button class="btn primary grow" data-act="log" data-id="${s.id}">+ บันทึกคาบ</button>
      ${full ? `<button class="btn orange grow" data-act="issue" data-id="${s.id}">ออกใบแจ้ง</button>` : ''}
      <button class="btn" data-act="detail" data-id="${s.id}">ประวัติ</button>

}

function rangeText(iv) {

/* ---------- ออกใบแจ้ง ---------- */

  const take = st.ub.slice(0, st.n);
  const full = take.length >= st.n;

  const sh = openSheet(`
    <h3>ออกใบแจ้ง · ${esc(s.name)} รอบที่ ${st.round}</h3>
    <div class="hint">${full ? `ครบ ${st.n} คาบ` : `ยังไม่ครบรอบ (${take.length}/${st.n} คาบ) ยอดคิดตามสัดส่วน แก้ได้`}</div>
    <table class="s">${take.map((x, i) => `<tr><td>${i + 1}</td><td>${thDate(x.date)}</td><td>${fmtH(x.hours)}</td></tr>`).join('')}</table>

    const iv = { id: uid(), studentId: sid, round: st.round, no, amount: amt, sessionIds: take.map(x => x.id),
      snap: take.map(x => ({ id: x.id, date: x.date, hours: x.hours })), studentName: s.name, perWeek: s.perWeek,
      issuedAt: todayISO(), status: 'issued', createdAt: Date.now() };
    putSettings({ nextNo: (db.settings.nextNo || 1) + 1 });

}
function markPaid(ivId) {
  const iv = db.invoices[ivId];
  if (!confirm(`ยืนยันรับเงิน ${money0(iv.amount)} บาท จาก ${iv.studentName} (รอบที่ ${iv.round})?\nคาบในรอบนี้จะถูกล็อก`)) return;
  put('invoices', { ...iv, status: 'paid', paidAt: todayISO() });
  toast('บันทึกรับเงินแล้ว 🔒');
}

async function drawInvoice(iv) {

  const W = 1080, P = 70, rowH = 58, F = (w, s) => `${w} ${s}px "TH Sarabun New"`;

  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#1b3a8c'; g.fillRect(0, 0, W, 16);
  const text = (t, x, y, font, color = '#1d2433', align = 'left') => { g.font = font; g.fillStyle = color; g.textAlign = align; g.fillText(t, x, y); };

  text(`รอบที่ ${iv.round} · ${iv.perWeek} คาบ/สัปดาห์`, W - P, y, F(400, 40), '#1d2433', 'right'); y += 40;
  // ตาราง

  const cx = [P + 30, P + 160, W - P - 30];
  text('คาบที่', cx[0], y + 42, F(700, 38)); text('วันที่เรียน', cx[1], y + 42, F(700, 38)); text('เวลาเรียน', cx[2], y + 42, F(700, 38), '#1d2433', 'right');
  y += rowH;

  g.fillStyle = '#fff3e2'; roundRect(g, P, y, W - 2 * P, 120, 22); g.fill();

function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function wrap(g, t, x, y, maxW, lh, font, color) {
  g.font = font; g.fillStyle = color; g.textAlign = 'center';
  // ตัดคำแบบง่าย: ตามช่องว่าง
  let line = '';
  for (const w of t.split(' ')) { const tst = line ? line + ' ' + w : w; if (g.measureText(tst).width > maxW && line) { g.fillText(line, x, y); y += lh; line = w; } else line = tst; }
  if (line) g.fillText(line, x, y);
  return y;
}

const shortDate = iso => { const d = parseISO(iso); return `${d.getDate()} ${TH_MONTHS[d.getMonth()]}`; };
function showHistory(filter = 'all', rerender) {
  const all = Object.values(db.invoices).sort((a, b) => (b.issuedAt || '').localeCompare(a.issuedAt || '') || (b.createdAt || 0) - (a.createdAt || 0));
  const list = all.filter(iv => filter === 'all' || (filter === 'paid' ? iv.status === 'paid' : iv.status !== 'paid'));
  const ym = todayISO().slice(0, 7);
  const paidThisMonth = all.filter(iv => iv.status === 'paid' && (iv.paidAt || '').startsWith(ym)).reduce((t, iv) => t + (+iv.amount), 0);
  const pending = all.filter(iv => iv.status !== 'paid'), pendingSum = pending.reduce((t, iv) => t + (+iv.amount), 0);
  const monthName = k => { const [y, m] = k.split('-').map(Number); return `${TH_MONTH_FULL[m - 1]} ${y + 543}`; };
  // จัดกลุ่มตามเดือน: รับเงินแล้วใช้เดือนที่รับเงิน, ยังไม่จ่ายใช้เดือนที่ออกใบแจ้ง
  const groups = new Map();
  list.forEach(iv => { const k = ((iv.status === 'paid' ? iv.paidAt : iv.issuedAt) || iv.issuedAt || '').slice(0, 7); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(iv); });
  const keys = [...groups.keys()].sort().reverse();
  const html = `
    <div class="row"><h3 class="grow">ประวัติการเงิน</h3><button class="btn ghost" data-h="close">ปิด</button></div>
    <div class="summary" style="grid-template-columns:repeat(2,minmax(0,1fr));margin:0">
      <div class="sum"><div class="v" style="color:var(--paid)">${money0(paidThisMonth)}</div><div class="k">บาท รับแล้วเดือนนี้</div></div>
      <div class="sum ${pending.length ? '' : 'zero'}"><div class="v" style="color:var(--stamp)">${money0(pendingSum)}</div><div class="k">บาท ยังไม่ได้รับ (${pending.length} ใบ)</div></div>
    </div>
    <div class="chips hchips">${[['all', 'ทั้งหมด'], ['issued', 'รอชำระ'], ['paid', 'รับเงินแล้ว']].map(([k, t]) => `<span class="chip ${filter === k ? 'on' : ''}" data-f="${k}">${t}</span>`).join('')}</div>
    ${keys.length ? keys.map(k => {
      const g = groups.get(k), got = g.filter(iv => iv.status === 'paid').reduce((t, iv) => t + (+iv.amount), 0);
      return `<div class="hmonth"><b>${k ? monthName(k) : 'ไม่ระบุเดือน'}</b>${got ? `<span class="hint">รับแล้ว ${money0(got)} บาท</span>` : ''}</div>` +
        g.map(iv => {
          const st = db.students[iv.studentId] || { name: iv.studentName };
          return `<div class="hrow ${iv.status === 'paid' ? 'paid' : 'issued'}">
            ${avatarHTML(st)}
            <div class="who"><b>${esc(st.name || iv.studentName)}</b><br><span class="hint">รอบที่ ${iv.round} · ${iv.sessionIds.length} คาบ</span><br>
              <span class="hint">${iv.status === 'paid' ? `🔒 รับเงิน ${shortDate(iv.paidAt)}` : `ส่ง ${shortDate(iv.issuedAt)} · ${daysSince(iv.issuedAt) ? `ค้าง ${daysSince(iv.issuedAt)} วัน` : 'วันนี้'}`}</span></div>
            <div style="text-align:right"><div class="amt">${money0(iv.amount)}</div>
              <div class="row" style="justify-content:flex-end;gap:4px">${iv.status !== 'paid' ? `<button class="btn green" style="padding:0 10px;font-size:18px" data-h="paid" data-x="${iv.id}">รับเงิน</button>` : ''}<button class="btn" style="padding:0 10px;font-size:18px" data-h="view" data-x="${iv.id}">ดู</button></div></div>
          </div>`;
        }).join('');
    }).join('') : '<div class="empty" style="font-size:20px">ยังไม่มีใบแจ้งในหมวดนี้</div>'}`;
  const sh = rerender ? (($('#sheet').innerHTML = html), $('#sheet')) : openSheet(html);

  sh.querySelectorAll('[data-h]').forEach(b => b.onclick = () => {
    const x = b.dataset.x;
    if (b.dataset.h === 'close') closeSheet();
    else if (b.dataset.h === 'paid') markPaid(x);
    else if (b.dataset.h === 'view') { const f = filter; showInvoice(x, () => showHistory(f)); }

const readCfg = () => { try { return JSON.parse(localStorage.getItem('tutor-fbcfg') || 'null'); } catch { return null; } };

/* ====================== Firebase ====================== */
let fbApi = null;
async function loadFirebase() {
  if (fbApi) return fbApi;
  const cfg = FIREBASE_CONFIG || readCfg(); if (!cfg) return null;
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VER}/`;
  const [app, authApi, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const a = app.initializeApp(cfg);
  const auth = authApi.getAuth(a);
  let fsdb;
  try { fsdb = fs.initializeFirestore(a, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); }
  catch (e) { fsdb = fs.getFirestore(a); }
  fbApi = { auth, authApi, fs, fsdb };
  authApi.onAuthStateChanged(auth, user => { if (user) startCloud(user); });
  return fbApi;
}
function startCloud(user) {
  if (cloud && cloud.uid === user.uid) return;
  const { fs, fsdb, auth, authApi } = fbApi;
  const localData = JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null');
  cloud = { fs, fsdb, auth, authApi, uid: user.uid, email: user.email };
  localStorage.setItem('tutor-signed-in', '1');
  loadFrom(MIRROR_KEY);
  const seen = new Set(); let pending = false;
  const done = () => {
    if (seen.size < 4) return;
    // ย้ายข้อมูลที่เคยเก็บในเครื่อง ขึ้นคลาวด์ครั้งแรก
    if (localData && Object.keys(localData.students || {}).length && !localStorage.getItem('tutor-migrated-' + user.uid)) {
      localStorage.setItem('tutor-migrated-' + user.uid, '1');
      if (confirm(`พบข้อมูลในเครื่องนี้ (นักเรียน ${Object.keys(localData.students).length} คน) อัปโหลดขึ้นคลาวด์ไหม?`)) {
        for (const col of ['students', 'sessions', 'invoices']) Object.values(localData[col] || {}).forEach(o => put(col, o));
        if (!Object.keys(db.students).length || confirm('ใช้การตั้งค่าจากเครื่องนี้ด้วยไหม?')) putSettings(localData.settings || {});
      }
    }
  };
  const mark = (k, snap) => { seen.add(k); pending = snap.metadata.hasPendingWrites; syncState = snap.metadata.fromCache ? 'offline' : (pending ? 'pending' : 'synced'); showSync(); saveSnapshot(); render(); done(); };
  for (const col of ['students', 'sessions', 'invoices']) {
    fs.onSnapshot(fs.collection(fsdb, 'users', user.uid, col), { includeMetadataChanges: true }, snap => {
      const o = {}; snap.forEach(d => o[d.id] = d.data()); db[col] = o; mark(col, snap);
    }, e => { syncState = 'error'; showSync(); toast('ซิงก์ผิดพลาด: ' + e.code); });
  }
  fs.onSnapshot(fs.doc(fsdb, 'users', user.uid, 'meta', 'settings'), { includeMetadataChanges: true }, snap => {
    if (snap.exists()) db.settings = { ...DEFAULT_SETTINGS, ...snap.data() }; mark('settings', snap);
  });
  showSync(); renderCloudBox();
}
function showSync() {
  $('#sync').textContent = cloud ? ({ synced: '☁️ ซิงก์แล้ว', pending: '☁️ กำลังซิงก์', offline: '☁️ ออฟไลน์', error: '⚠️ ซิงก์ไม่ได้' }[syncState] || '☁️')
    : ((FIREBASE_CONFIG || readCfg()) ? '🔑 ยังไม่ล็อกอิน' : '💾 ในเครื่องนี้');
}

/* ====================== เริ่มต้น ====================== */
$('#btnAdd').onclick = () => showStudentForm();
{ const d = new Date(); $('#today').textContent = `วัน${TH_DAY_FULL[d.getDay()]} ${d.getDate()} ${TH_MONTH_FULL[d.getMonth()]}`; }
$('#btnSettings').onclick = showSettings;
$('#btnHistory').onclick = () => showHistory();
// เคยล็อกอินไว้ → แสดงสำเนาข้อมูลคลาวด์ก่อนระหว่างรอซิงก์, ไม่เคย → ใช้ข้อมูลในเครื่อง
loadFrom(localStorage.getItem('tutor-signed-in') ? MIRROR_KEY : LOCAL_KEY);
render(); showSync();
document.fonts.ready.then(render);
if (FIREBASE_CONFIG || readCfg()) loadFirebase().catch(e => { console.warn(e); syncState = 'error'; showSync(); });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
// รีเฟรชตัวนับวันเมื่อกลับมาเปิดแอป
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
window.__tutor = { db, render };
</script>
